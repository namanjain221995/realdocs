# RealtimeDocs with several server instances (docs/scaling.md).
#
# An overlay for the repository's docker-compose.yml. It adds Redis, a second
# server instance and a small load balancer, and tells both instances to
# coordinate through Redis.
#
#   docker compose -p <project> --env-file <env file> \
#     -f docker-compose.yml -f deploy/scale/docker-compose.scale.yml up -d --build --wait
#
# NEVER use the project name `realtimedocs` for a trial: that is the live
# deployment on this server. The live deployment runs one instance and does not
# use this file; moving it to several instances is described in docs/scaling.md
# and is a decision for its owner.
#
# Both instances must share: the database, the asset and download volumes, the
# same SESSION_SECRET and the same PUBLIC_ORIGIN.

x-scale-env: &scale-env
  # Redis decides which instance owns a document and holds collaboration tickets:
  # it is never published and always needs the password.
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in the env file (openssl rand -hex 32)}@redis:6379
  CLUSTER_LEASE_TTL_SECONDS: '10'
  # Readiness says "not ready" this long before connections are closed on a stop,
  # so the load balancer has moved on (it checks every 2 s).
  SHUTDOWN_DRAIN_SECONDS: '6'

services:
  redis:
    image: redis:8.8.3
    restart: unless-stopped
    # Coordination state only (leases, tickets, counters): nothing here needs to
    # survive a restart, so no persistence and a memory ceiling.
    command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-ttl
      - --requirepass
      - ${REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs: ['/data']
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']

  server:
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *scale-env
      CLUSTER_INTERNAL_URL: http://server:4310
    # Longer than SHUTDOWN_DRAIN_SECONDS plus the flush of the durable logs.
    stop_grace_period: 40s

  server2:
    extends:
      file: docker-compose.yml
      service: server
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Migrations are applied by the first instance; the second starts after it.
      server:
        condition: service_healthy
    environment:
      <<: *scale-env
      CLUSTER_INTERNAL_URL: http://server2:4310
    ports: !reset []
    stop_grace_period: 40s

  lb:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./deploy/scale/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '127.0.0.1:${RD_LB_PORT:-4460}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/api/health']
      interval: 5s
      timeout: 3s
      retries: 10
