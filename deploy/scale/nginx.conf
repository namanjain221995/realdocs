# Load balancer in front of the RealtimeDocs server instances (docs/scaling.md).
#
# No stickiness is needed: an instance that receives a collaboration socket for
# a document owned by another instance forwards it there itself. An instance
# that is stopping answers 503 on /api/ready; nginx (open source) only notices
# failed requests, so `max_fails`/`fail_timeout` take it out after the first
# refused connection. A proxy with active health checks (HAProxy, Caddy, a
# cloud load balancer) should probe /api/ready instead.
worker_processes auto;
events {
  worker_connections 8192;
}
http {
  access_log off;
  server_tokens off;
  # WebSocket upgrade for /collab.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }
  upstream realtimedocs {
    # Shared between the worker processes: without it every worker counts
    # connections on its own and they all pick the first server.
    zone realtimedocs 64k;
    least_conn;
    server server:4310  max_fails=1 fail_timeout=5s;
    server server2:4310 max_fails=1 fail_timeout=5s;
    keepalive 64;
  }
  server {
    listen 8080;
    # Uploads are limited by the application (LIMIT_MAX_ATTACHMENT_BYTES).
    client_max_body_size 64m;
    location / {
      proxy_pass http://realtimedocs;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # Exactly one proxy in front of the application: TRUST_PROXY=1.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_request_buffering off;
      proxy_buffering off;
      # Collaboration sockets are long-lived; the application pings every 15 s.
      # An instance that was removed does not refuse connections, it just never
      # answers: give up quickly and try the other one.
      proxy_connect_timeout 1s;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_next_upstream error timeout http_503 non_idempotent;
    }
  }
}
