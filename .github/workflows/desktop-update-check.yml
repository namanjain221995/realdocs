# Manual check on native runners of "Update and restart": a packaged build is installed into a
# scratch folder and started, a newer build is served from a local HTTP server, and the app's own
# update service, installer and helper script replace the installation and relaunch it.
# See apps/desktop/scripts/update-check.mjs for exactly what is and is not exercised.
name: Desktop update check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, platform: win32 }
          - { name: macos-arm64, os: macos-15, platform: darwin }
          - { name: linux, os: ubuntu-latest, platform: linux }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Helper script in the foreground (diagnostic)
        if: matrix.platform != 'linux'
        shell: bash
        run: node apps/desktop/scripts/helper-probe.mjs

      - name: Unit tests of the installer and the update service
        run: pnpm --filter @realtimedocs/desktop exec vitest run test/unit/update-install.test.ts test/unit/updates.test.ts

      - name: Package the version to be replaced
        shell: bash
        run: node apps/desktop/scripts/package.mjs --platform "${{ matrix.platform }}"

      - name: Update check (Windows, macOS)
        if: matrix.platform != 'linux'
        shell: bash
        run: node --import tsx apps/desktop/scripts/update-check.mjs

      # GitHub's Ubuntu image does not allow the Chromium sandbox for an unpacked app, and has no
      # display: the check runs under Xvfb with the sandbox switched off (stated, not hidden).
      - name: Update check (Linux, Xvfb)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          RD_LAUNCH_NO_SANDBOX=1 xvfb-run -a --server-args="-screen 0 1600x900x24" \
            node --import tsx apps/desktop/scripts/update-check.mjs
